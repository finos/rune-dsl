name: PR Checks

on:
  pull_request:

# Cancel previous jobs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-on-ubuntu:
    name: Maven Build on Ubuntu
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/maven-build
  
  build-on-windows:
    name: Maven Build on Windows
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/maven-build

  namespace-checkers:
    name: Namespace checker unit tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    # PyYAML reads the shared pattern corpus. It is a test-only dependency: the checkers
    # themselves use only the standard library, since they run in other repositories with
    # nothing but `setup-python`.
    - name: Install test dependencies
      run: pip install pyyaml
    # The checkers under .github/scripts are consumed by other repositories through the
    # reusable verify-readonly-namespaces workflow, so they are tested here.
    - name: Run checker unit tests
      working-directory: .github/scripts
      run: python -m unittest discover -p 'test_*.py' -v
