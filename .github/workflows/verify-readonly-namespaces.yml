name: Verify namespaces

# Reusable workflow with two independent checks over the namespaces configured in the
# project's rune-config.yml:
#
#   Read-only namespaces  - fails when a read-only namespace (a `namespaceConfig` entry
#                           marked `readOnly: true`) is changed by hand.
#   Generated namespaces  - reports, without failing, when a generated namespace (an entry
#                           carrying an `origin` marker) is changed. Those namespaces are
#                           produced by an importer and are meant to be refined by hand, so a
#                           blocking check would only attract a bypass label; the annotation
#                           puts the change in front of a reviewer instead.
#
# Both run as steps of one job, so a consumer gets one check and one checkout, and the job id
# `verify` -- which is what a branch-protection rule pins to -- is unchanged.
#
# Call it with:
#
#   jobs:
#     readonly-namespaces:
#       uses: finos/rune-dsl/.github/workflows/verify-readonly-namespaces.yml@main
#       with:
#         config-path: rosetta-source/src/main/resources/rune-config.yml
#         root: rosetta-source/src/main/rosetta
#
# For more info, see https://rune.finos.org/docs/developers/read-only-namespaces
# and https://rune.finos.org/docs/developers/generated-namespaces
#
on:
  workflow_call:
    inputs:
      config-path:
        description: "Path to the rune-config.yml whose namespaceConfig lists the read-only and generated namespaces."
        required: true
        type: string
      base-ref:
        description: "Git ref to diff HEAD against. Defaults to the pull request base branch, or the repository default branch."
        required: false
        default: ""
        type: string
      root:
        description: "Directory under which to scan for .rosetta files."
        required: false
        default: "."
        type: string
      checker-ref:
        description: "Ref of finos/rune-dsl from which to fetch the checker script."
        required: false
        default: "main"
        type: string
      bypass-label:
        description: "Pull request label that skips the read-only check, to allow an intentional one-off change to a read-only namespace."
        required: false
        default: "override-readonly-namespaces"
        type: string
      generated-namespaces-docs-url:
        description: "Documentation link appended to every generated-namespace annotation."
        required: false
        default: "https://rune.finos.org/docs/developers/generated-namespaces"
        type: string

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository under test
        uses: actions/checkout@v6
        with:
          # Full history so HEAD can be diffed against the base ref.
          fetch-depth: 0

      - name: Check out the namespace checkers
        uses: actions/checkout@v6
        with:
          repository: finos/rune-dsl
          ref: ${{ inputs.checker-ref }}
          path: .rune-dsl-checker
          sparse-checkout: .github/scripts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          # Caches the downloaded wheel across runs of this workflow in the calling repository.
          cache: 'pip'
          cache-dependency-path: .rune-dsl-checker/.github/scripts/requirements.txt

      - name: Install checker dependencies
        run: pip install --disable-pip-version-check --quiet -r .rune-dsl-checker/.github/scripts/requirements.txt

      - name: Resolve base ref
        id: base
        shell: bash
        run: |
          if [ -n "${{ inputs.base-ref }}" ]; then
            base="${{ inputs.base-ref }}"
          elif [ -n "${{ github.base_ref }}" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
          else
            git fetch --no-tags origin "${{ github.event.repository.default_branch }}"
            base="origin/${{ github.event.repository.default_branch }}"
          fi
          echo "ref=$base" >> "$GITHUB_OUTPUT"
          echo "Diffing against base ref: $base"

      - name: Check read-only namespaces
        if: ${{ !contains(github.event.pull_request.labels.*.name, inputs.bypass-label) }}
        shell: bash
        run: |
          python .rune-dsl-checker/.github/scripts/check_readonly_namespaces.py \
            --base "${{ steps.base.outputs.ref }}" \
            --config "${{ inputs.config-path }}" \
            --root "${{ inputs.root }}"

      - name: Read-only namespace check bypassed
        if: ${{ contains(github.event.pull_request.labels.*.name, inputs.bypass-label) }}
        run: |
          echo "::notice::Read-only namespace check skipped because the '${{ inputs.bypass-label }}' label is present on this pull request."

      # Reports only, and so is never bypassed and never fails: there is nothing to override, and
      # a generated namespace is meant to be edited. `always()` so it still runs when the read-only
      # check above failed -- a pull request can touch both kinds of namespace.
      - name: Annotate generated namespaces
        if: ${{ always() }}
        shell: bash
        run: |
          python .rune-dsl-checker/.github/scripts/annotate_generated_namespaces.py \
            --base "${{ steps.base.outputs.ref }}" \
            --config "${{ inputs.config-path }}" \
            --root "${{ inputs.root }}" \
            --docs-url "${{ inputs.generated-namespaces-docs-url }}"
